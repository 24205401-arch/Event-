<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Event</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="topbar">
    <h1>Admin Dashboard &middot; <span th:text="${currentUser.userId}"></span></h1>
    <a class="logout" th:href="@{/logout}">Log out</a>
</div>

<div class="wrap">

    <a class="back-link" th:href="@{/admin/dashboard}">&larr; Back to dashboard</a>

    <div class="new-event-form">
        <div class="section-title" style="margin-top:0;">Edit Event</div>
        <form th:action="@{/admin/events/{id}/edit(id=${event.id})}" method="post">
            <div class="grid-2">
                <div>
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" th:value="${event.title}" required>
                </div>
                <div>
                    <label for="venue">Venue</label>
                    <input type="text" id="venue" name="venue" th:value="${event.venue}" required>
                </div>
            </div>

            <label for="description">Description</label>
            <textarea id="description" name="description" required th:text="${event.description}"></textarea>

            <div class="grid-2">
                <div>
                    <label for="eventDate">Date</label>
                    <input type="date" id="eventDate" name="eventDate" th:value="${event.eventDate}" required>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label for="startTime">Start Time</label>
                    <input type="time" id="startTime" name="startTime" th:value="${event.startTime}" required>
                </div>
                <div>
                    <label for="endTime">End Time</label>
                    <input type="time" id="endTime" name="endTime" th:value="${event.endTime}" required>
                </div>
            </div>

            <button type="submit" class="full-btn">Save Changes</button>
        </form>
    </div>
</div>
</body>
</html>
