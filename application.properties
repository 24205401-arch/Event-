# Application
spring.application.name=Master Events

# Server
server.port=8080

# H2 file-based database (data survives restarts). Change to jdbc:h2:mem:eventdb for in-memory only.
spring.datasource.url=jdbc:h2:file:./data/eventdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console (open http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
