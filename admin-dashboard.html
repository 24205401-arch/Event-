<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="topbar">
    <h1>Admin Dashboard &middot; <span th:text="${currentUser.userId}"></span></h1>
    <a class="logout" th:href="@{/logout}">Log out</a>
</div>

<div class="wrap">

    <div class="new-event-form">
        <div class="section-title" style="margin-top:0;">Create New Event</div>
        <form th:action="@{/admin/events/create}" method="post">
            <div class="grid-2">
                <div>
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div>
                    <label for="venue">Venue</label>
                    <input type="text" id="venue" name="venue" required>
                </div>
            </div>

            <label for="description">Description</label>
            <textarea id="description" name="description" required></textarea>

            <div class="grid-2">
                <div>
                    <label for="eventDate">Date</label>
                    <input type="date" id="eventDate" name="eventDate" required>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label for="startTime">Start Time</label>
                    <input type="time" id="startTime" name="startTime" required>
                </div>
                <div>
                    <label for="endTime">End Time</label>
                    <input type="time" id="endTime" name="endTime" required>
                </div>
            </div>

            <button type="submit" class="full-btn">Create Event</button>
        </form>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" th:text="${upcomingCount}"></div>
            <div class="stat-label">Upcoming Events</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" th:text="${liveCount}"></div>
            <div class="stat-label">Live Events</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" th:text="${totalCount}"></div>
            <div class="stat-label">Total Events</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" th:text="${completedCount}"></div>
            <div class="stat-label">Completed Events</div>
        </div>
    </div>

    <div class="section-title">All Events</div>

    <div th:if="${#lists.isEmpty(events)}" style="color:#6b7280;">
        No events created yet.
    </div>

    <div class="event-card" th:each="ev : ${events}">
        <div class="info">
            <h3>
                <span th:text="${ev.title}"></span>
                <span class="badge upcoming" th:if="${ev.status == 'UPCOMING'}">Upcoming</span>
                <span class="badge live" th:if="${ev.status == 'LIVE'}">Live</span>
                <span class="badge completed" th:if="${ev.status == 'COMPLETED'}">Completed</span>
            </h3>
            <p th:text="${ev.description}"></p>
            <p>📍 <span th:text="${ev.venue}"></span> &nbsp;|&nbsp; 📅 <span th:text="${ev.eventDate}"></span>
                <span th:if="${ev.startTime != null and !ev.startTime.isEmpty()}">
                    &nbsp;|&nbsp; ⏰ <span th:text="${ev.startTime}"></span>
                    <span th:if="${ev.endTime != null and !ev.endTime.isEmpty()}"> - <span th:text="${ev.endTime}"></span></span>
                </span>
            </p>
            <p th:if="${ev.createdByName != null}" class="creator-line">
                Created by <span th:text="${ev.createdByName}"></span>
                (<span th:text="${ev.createdByUserId}"></span>)
            </p>
        </div>
        <div class="actions">
            <a class="btn secondary" th:href="@{/admin/events/{id}/joined(id=${ev.id})}">View Joined Users</a>
            <a class="btn secondary" th:href="@{/admin/events/{id}/export(id=${ev.id})}">Export Attendees (ZIP)</a>
            <a class="btn secondary" th:href="@{/admin/events/{id}/edit(id=${ev.id})}">Edit</a>
            <form th:action="@{/admin/events/{id}/delete(id=${ev.id})}" method="post"
                  onsubmit="return confirm('Delete this event?');">
                <button type="submit" class="danger">Delete</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
